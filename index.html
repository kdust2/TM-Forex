  <script src="tm-forex-learn-and-earn.js"></script>
  <script>
    (function () {
      var root = document.getElementById("root");
      if (!root) return;

      function routePageLinks() {
        root.querySelectorAll('a[href="#services"]').forEach(function (link) {
          link.href = "services.html";
        });
        root.querySelectorAll('a[href="#about"]').forEach(function (link) {
          link.href = "about.html";
        });
        root.querySelectorAll('header a[href="#contact"]').forEach(function (link) {
          if (link.textContent.trim().toLowerCase() === "contact") {
            link.href = "contact.html";
          }
        });
      }

      function addClaritySection() {
        var services = root.querySelector("#services");
        if (!services || root.querySelector("#clarity-forward")) return;

        var section = document.createElement("section");
        section.id = "clarity-forward";
        section.className = "tm-clarity-section tm-reveal";
        section.innerHTML = `
          <div class="tm-clarity-inner">
            <div class="tm-journal-card" role="img" aria-label="Trade journal chart showing steady, plan-led consistency">
              <div class="tm-journal-top"><span>Trade journal</span><span>2026</span></div>
              <div class="tm-journal-chart" aria-hidden="true">
                <div class="tm-journal-bars"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
                <div class="tm-journal-line"></div>
              </div>
              <div class="tm-journal-bottom"><span>Consistency</span><strong>On plan</strong></div>
            </div>
            <div class="tm-clarity-copy">
              <p class="tm-clarity-kicker">A better way forward</p>
              <h2>Clarity beats <span>chasing the market.</span></h2>
              <p class="tm-clarity-intro">The market is always moving. Your strategy should not have to. TM Forex brings together disciplined execution, responsible risk thinking, and real guidance so you can make decisions from a stronger position.</p>
              <ol class="tm-clarity-points">
                <li><span>01</span><div><h3>Understand the setup</h3><p>Know why a trade makes sense before acting.</p></div></li>
                <li><span>02</span><div><h3>Manage the downside</h3><p>Build risk into every decision, not after it.</p></div></li>
                <li><span>03</span><div><h3>Stay supported</h3><p>Get expert assistance whenever markets are open.</p></div></li>
              </ol>
              <a class="tm-clarity-cta" href="services.html">Ask how we can help <span aria-hidden="true">&rarr;</span></a>
            </div>
          </div>`;

        services.parentNode.insertBefore(section, services);
        services.style.display = "none";
      }

      function updateAboutSection() {
        var about = root.querySelector("#about");
        if (!about || about.dataset.tmAboutUpdated === "true") return;

        var missionVision = about.querySelector(".mt-8.grid.grid-cols-2.gap-4");
        if (missionVision) {
          var aboutCopy = missionVision.parentElement;
          missionVision.remove();
          var aboutLink = document.createElement("a");
          aboutLink.href = "about.html";
          aboutLink.className = "inline-flex items-center gap-2 mt-8 px-6 py-3.5 bg-[#5C1A2A] text-[#F5E6C8] rounded-full sans text-[12px] tracking-[0.14em] uppercase font-semibold";
          aboutLink.textContent = "Our mission and vision";
          aboutCopy.appendChild(aboutLink);
        }

        var avatar = about.querySelector(".w-14.h-14.rounded-full");
        if (avatar && avatar.textContent.trim() === "SN") {
          avatar.textContent = "TM";
        }
        about.dataset.tmAboutUpdated = "true";
      }

      function updateCeoNameAndEmails() {
        var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
        var textNodes = [];
        var textNode;
        while ((textNode = walker.nextNode())) {
          if (textNode.parentElement && !textNode.parentElement.closest("a,script,style")) {
            textNodes.push(textNode);
          }
        }

        var emailPattern = /[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi;
        textNodes.forEach(function (node) {
          var original = node.nodeValue;
          var updated = original.replace(/Stephen Nunno/g, "Mr TM");
          if (updated !== original) node.nodeValue = updated;

          emailPattern.lastIndex = 0;
          var match = emailPattern.exec(node.nodeValue);
          if (!match) return;

          var fragment = document.createDocumentFragment();
          var value = node.nodeValue;
          var cursor = 0;
          emailPattern.lastIndex = 0;
          while ((match = emailPattern.exec(value))) {
            fragment.appendChild(document.createTextNode(value.slice(cursor, match.index)));
            var emailLink = document.createElement("a");
            emailLink.className = "tm-email-link";
            emailLink.href = "https://mail.google.com/mail/?view=cm&fs=1&to=" + encodeURIComponent(match[0]);
            emailLink.target = "_blank";
            emailLink.rel = "noopener noreferrer";
            emailLink.textContent = match[0];
            fragment.appendChild(emailLink);
            cursor = match.index + match[0].length;
          }
          fragment.appendChild(document.createTextNode(value.slice(cursor)));
          node.parentNode.replaceChild(fragment, node);
        });
      }

      function installPageReveals() {
        var sections = Array.prototype.slice.call(
          root.querySelectorAll("section, footer")
        ).filter(function (element) {
          return !element.closest("#services");
        });
        var cards = Array.prototype.slice.call(
          root.querySelectorAll(
            "#about .grid > div, #contact .grid > div, .tm-founder-card, .tm-about-value"
          )
        );

        sections.forEach(function (element, index) {
          element.classList.add("tm-reveal");
          element.style.transitionDelay = Math.min(index * 80, 240) + "ms";
        });
        cards.forEach(function (element, index) {
          element.classList.add("tm-reveal-card");
          element.style.transitionDelay = Math.min(index * 90, 360) + "ms";
        });

        function revealVisible() {
          root.querySelectorAll(".tm-reveal, .tm-reveal-card").forEach(function (element) {
            var bounds = element.getBoundingClientRect();
            if (bounds.top < window.innerHeight * 0.9 && bounds.bottom > 0) {
              element.classList.add("tm-visible");
            }
          });
        }

        if (root.dataset.tmInlineReveal !== "true") {
          window.addEventListener("scroll", revealVisible, { passive: true });
          window.addEventListener("resize", revealVisible);
          root.dataset.tmInlineReveal = "true";
        }
        revealVisible();
      }

      function setupQuickEnquiry() {
        var interestLabel = Array.prototype.find.call(root.querySelectorAll("label"), function (label) {
          return label.textContent.trim() === "Your Interest";
        });
        if (!interestLabel) return;

        var optionsGrid = interestLabel.parentElement.querySelector(".grid");
        if (!optionsGrid || optionsGrid.dataset.tmQuickEnquiryReady === "true") return;

        var enquiryPanel = interestLabel.closest(".space-y-4");
        var whatsappLink = enquiryPanel && enquiryPanel.querySelector('a[href*="wa.me"]');
        if (!whatsappLink) return;

        var services = [
          "Managed Portfolios",
          "Daily Forex Signals",
          "1-on-1 Mentorship",
          "Automated Trading Systems"
        ];
        var status = document.createElement("p");
        status.className = "tm-quick-enquiry-status";
        status.setAttribute("aria-live", "polite");
        optionsGrid.replaceChildren();

        services.forEach(function (service) {
          var option = document.createElement("button");
          option.type = "button";
          option.className = "tm-quick-service-option";
          option.textContent = service;
          option.setAttribute("aria-pressed", "false");
          option.addEventListener("click", function () {
            var selected = Array.prototype.slice.call(
              optionsGrid.querySelectorAll('.tm-quick-service-option[aria-pressed="true"]')
            ).map(function (button) {
              return button.textContent.trim();
            });

            if (option.getAttribute("aria-pressed") === "true") {
              selected = selected.filter(function (item) {
                return item !== service;
              });
            } else {
              selected.push(service);
            }

            var isSelected = selected.indexOf(service) !== -1;
            option.setAttribute("aria-pressed", String(isSelected));
            option.style.backgroundColor = isSelected ? "#d4af37" : "";
            option.style.borderColor = isSelected ? "#b58b1a" : "";
            option.style.color = isSelected ? "#2b1116" : "";
            option.style.fontWeight = isSelected ? "700" : "";
            option.style.boxShadow = isSelected ? "0 4px 12px rgba(212, 175, 55, 0.2)" : "";
            whatsappLink.setAttribute("aria-disabled", String(selected.length === 0));

            var textNode = Array.prototype.find.call(whatsappLink.childNodes, function (node) {
              return node.nodeType === Node.TEXT_NODE;
            });
            if (textNode) {
              textNode.nodeValue = selected.length ? "Proceed to WhatsApp " : "Choose services to continue ";
            }

            if (selected.length) {
              var message = "Hi TM Forex, I am interested in: " + selected.join(", ") + ". Please send me details about enrollment.";
              whatsappLink.href = "https://wa.me/233599623714?text=" + encodeURIComponent(message);
              whatsappLink.setAttribute("aria-label", "Proceed to WhatsApp about " + selected.join(", "));
              status.textContent = selected.length + (selected.length === 1 ? " service selected." : " services selected.");
            } else {
              whatsappLink.href = "https://wa.me/233599623714";
              whatsappLink.removeAttribute("aria-label");
              status.textContent = "Choose one or more services.";
            }
          });
          optionsGrid.appendChild(option);
        });

        optionsGrid.insertAdjacentElement("afterend", status);
        whatsappLink.setAttribute("aria-disabled", "true");
        var initialText = Array.prototype.find.call(whatsappLink.childNodes, function (node) {
          return node.nodeType === Node.TEXT_NODE;
        });
        if (initialText) initialText.nodeValue = "Choose services to continue ";
        status.textContent = "Choose one or more services.";
        optionsGrid.dataset.tmQuickEnquiryReady = "true";
      }

      function syncHomepageFooterPrograms() {
        var programs = [
          "Managed Portfolios",
          "Daily Forex Signals",
          "1-on-1 Mentorship",
          "Automated Trading Systems"
        ];
        var heading = Array.prototype.find.call(root.querySelectorAll("footer *"), function (element) {
          return element.children.length === 0 && element.textContent.trim() === "Programs";
        });
        var list = heading && heading.nextElementSibling;
        if (!list) return;

        var current = Array.prototype.map.call(list.children, function (item) {
          return item.textContent.trim();
        });
        if (current.length === programs.length && current.every(function (item, index) {
          return item === programs[index];
        })) return;

        var fragment = document.createDocumentFragment();
        programs.forEach(function (program) {
          var item = document.createElement("div");
          item.textContent = program;
          fragment.appendChild(item);
        });
        list.replaceChildren(fragment);
      }

      function restoreBrandImages(header) {
        var logoPath = "tm-forex-logo.svg";
        root.querySelectorAll('img[alt="TM Forex"], img[alt="TM Forex logo"], img[alt="TM Forex Badge"], img[alt="Badge"]').forEach(function (image) {
          image.src = logoPath;
        });

        var center = root.querySelector('[class*="inset-[56px]"]');
        if (center && !center.querySelector("[data-tm-center-logo]")) {
          var centerLogo = document.createElement("img");
          centerLogo.src = logoPath;
          centerLogo.alt = "TM Forex logo";
          centerLogo.className = "w-full h-full object-contain rounded-full";
          centerLogo.setAttribute("data-tm-center-logo", "");
          center.appendChild(centerLogo);
        }

        var brand = header.querySelector(".flex.items-center.gap-4");
        if (brand && !brand.querySelector("[data-tm-header-logo]")) {
          var mark = document.createElement("div");
          mark.className = "w-11 h-11 rounded-full bg-white shadow-[0_0_0_1px_rgba(212,175,55,0.3),0_8px_20px_rgba(92,26,42,0.12)] flex items-center justify-center overflow-hidden p-[3px]";
          mark.setAttribute("data-tm-header-logo", "");

          var headerLogo = document.createElement("img");
          headerLogo.src = logoPath;
          headerLogo.alt = "TM Forex logo";
          headerLogo.className = "w-full h-full object-contain rounded-full";
          mark.appendChild(headerLogo);
          brand.insertBefore(mark, brand.firstChild);
        }
      }

      function ensureContactAnchor() {
        var contact = document.getElementById("contact");
        if (contact) return;

        var nodes = Array.prototype.slice.call(root.querySelectorAll("*"));
        var match = nodes.find(function (element) {
          var text = (element.textContent || "").replace(/\s+/g, " ").trim();
          return /Contact TM Forex|Ready to start trading with a plan\?/i.test(text);
        });

        if (!match) return;

        var anchorTarget = match.closest("section, div, article");
        if (anchorTarget) {
          anchorTarget.id = "contact";
        }
      }

      function addHomeLinks() {
        addClaritySection();
        updateAboutSection();
        updateCeoNameAndEmails();
        routePageLinks();
        installPageReveals();
        ensureContactAnchor();
        setupQuickEnquiry();
        syncHomepageFooterPrograms();

        var header = root.querySelector("header");
        var desktopNav = header && header.querySelector("nav");
        if (!desktopNav) return;

        restoreBrandImages(header);

        if (!desktopNav.querySelector("[data-tm-home-link]")) {
          var desktopHome = document.createElement("a");
          desktopHome.href = "#";
          desktopHome.className = desktopNav.querySelector("a").className;
          desktopHome.textContent = "Home";
          desktopHome.setAttribute("data-tm-home-link", "");
          desktopHome.setAttribute("aria-current", "page");
          desktopNav.insertBefore(desktopHome, desktopNav.firstChild);
        }

        var mobileMenu = Array.prototype.find.call(header.children, function (child) {
          return child.tagName === "DIV" &&
            child.classList.contains("md:hidden") &&
            child.classList.contains("border-t");
        });

        if (mobileMenu && !mobileMenu.querySelector("[data-tm-home-link]")) {
          var mobileHome = document.createElement("a");
          mobileHome.href = "#";
          mobileHome.textContent = "Home";
          mobileHome.setAttribute("data-tm-home-link", "");
          mobileHome.setAttribute("aria-current", "page");
          mobileHome.addEventListener("click", function () {
            var menuButton = header.querySelector("button");
            if (menuButton) menuButton.click();
          });
          mobileMenu.insertBefore(mobileHome, mobileMenu.firstChild);
        }

        var toggleButton = header.querySelector("button");
        if (toggleButton && !toggleButton.dataset.tmMobileMenuReady) {
          toggleButton.dataset.tmMobileMenuReady = "true";
          toggleButton.setAttribute("type", "button");
          toggleButton.addEventListener("click", function () {
            var isMobile = window.innerWidth <= 767;
            if (!isMobile) return;
            var isOpen = toggleButton.getAttribute("aria-expanded") === "true";
            toggleButton.setAttribute("aria-expanded", String(!isOpen));
            desktopNav.style.display = isOpen ? "none" : "grid";
            desktopNav.style.position = "absolute";
            desktopNav.style.top = "calc(100% + 8px)";
            desktopNav.style.right = "12px";
            desktopNav.style.left = "12px";
            desktopNav.style.zIndex = "60";
            desktopNav.style.padding = "10px";
            desktopNav.style.border = "1px solid rgba(92, 26, 42, 0.12)";
            desktopNav.style.borderRadius = "18px";
            desktopNav.style.background = "rgba(255, 255, 255, 0.98)";
            desktopNav.style.boxShadow = "0 18px 46px rgba(92, 26, 42, 0.14)";
            desktopNav.style.gridTemplateColumns = "1fr";
            desktopNav.style.gap = "4px";
          });
        }

        if (window.innerWidth <= 767) {
          desktopNav.style.display = "none";
          desktopNav.style.position = "absolute";
          desktopNav.style.top = "calc(100% + 8px)";
          desktopNav.style.right = "12px";
          desktopNav.style.left = "12px";
          desktopNav.style.zIndex = "60";
          desktopNav.style.gridTemplateColumns = "1fr";
          desktopNav.style.gap = "4px";
          if (toggleButton) {
            toggleButton.setAttribute("aria-expanded", "false");
          }
        }
      }

      new MutationObserver(addHomeLinks).observe(root, {
        childList: true,
        subtree: true
      });
      addHomeLinks();
    })();
  </script>
</body>
</html>
